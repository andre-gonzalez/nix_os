# Build checks for every PR and every push to main.
#
#   eval           every nixosConfiguration evaluates (laptops included: a
#                  module shared with servarr must work on unstable AND on
#                  nixpkgs-stable, which servarr is built from)
#   build-servarr  servarr's full system closure builds. The laptops are only
#                  evaluated: their closures (desktop, custom suckless builds)
#                  are too big for a hosted runner and change more often.
#
# This repo is public, so these logs are public. Nothing here uses a secret;
# never add a step that prints a decrypted file or the server's address.

name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    name: eval all hosts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Evaluate every nixosConfiguration
        run: |
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          failed=0
          for h in $hosts; do
            echo "::group::$h"
            if nix eval --raw ".#nixosConfigurations.$h.config.system.build.toplevel.drvPath"; then
              echo
            else
              echo "::error::$h does not evaluate"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  build-servarr:
    name: build servarr
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Build the servarr system closure
        run: nix build --print-build-logs --no-link .#nixosConfigurations.servarr.config.system.build.toplevel
